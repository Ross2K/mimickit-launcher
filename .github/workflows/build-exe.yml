name: Build Windows exe (PyInstaller)
on:
  workflow_dispatch:
  push:
    tags: ["a*", "v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip pyinstaller matplotlib
      - name: Build
        run: pyinstaller --noconfirm --onefile --windowed --name MimicKitLauncher --icon docs/icon.ico mimickit_launcher.py
      - name: Smoke test (imports only)
        run: python -c "import mimickit_launcher as m; print(m.VERSION)"
      - uses: actions/upload-artifact@v4
        with:
          name: MimicKitLauncher-exe
          path: dist/MimicKitLauncher.exe
